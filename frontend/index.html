<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasePrint — Campus Xerox & Print Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif'],
              body: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace'],
            },
            colors: {
              brand: {
                50: '#F0F9FF',
                100: '#E0F2FE',
                200: '#BAE6FD',
                500: '#0284C7',
                600: '#2563EB',
                700: '#1D4ED8',
                800: '#1E40AF',
                900: '#1E1B4B',
                blue: '#2563EB',
                'blue-hover': '#1D4ED8',
                sky: '#0284C7',
                cyan: '#06B6D4',
                indigo: '#4F46E5',
                'indigo-deep': '#1E1B4B',
              },
              surface: {
                canvas: '#F8FAFC',
                card: '#FFFFFF',
                inset: '#F1F5F9',
                elevated: '#FFFFFF',
              }
            },
            boxShadow: {
              'photonic': '0 0 25px -5px rgba(37, 99, 235, 0.25), 0 8px 16px -6px rgba(6, 182, 212, 0.2)',
              'photonic-sm': '0 0 15px -3px rgba(37, 99, 235, 0.15)',
              'card': '0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 1px 2px -1px rgba(15, 23, 42, 0.05)',
              'card-hover': '0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04)',
              'dock': '0 20px 40px -15px rgba(15, 23, 42, 0.12), 0 0 0 1px rgba(226, 232, 240, 0.8)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --brand-blue: #2563EB;
        --brand-sky: #0284C7;
        --brand-cyan: #06B6D4;
        --canvas-bg: #F8FAFC;
        --text-primary: #0F172A;
      }
      body {
        background-color: #F8FAFC;
        color: #0F172A;
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      }
      /* Custom scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F1F5F9;
      }
      ::-webkit-scrollbar-thumb {
        background: #CBD5E1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94A3B8;
      }
      /* Reduced motion classes */
      @media (prefers-reduced-motion: reduce) {
        *, ::before, ::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
          scroll-behavior: auto !important;
        }
      }
      .reduced-motion *, .reduced-motion *::before, .reduced-motion *::after {
        animation: none !important;
        transition: none !important;
      }
      /* Focus visible ring standards */
      *:focus-visible {
        outline: 2px solid #0284C7;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
